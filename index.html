<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди пару: задача → способ решения</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f4f7fb;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #1e293b;
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 10px 14px;
  }
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    color: #0f3d6e;
  }
  #hud {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #475569;
  }
  #hud b { color: #1976d2; }
  #board {
    position: relative;
    flex: 1;
    background: #ffffff;
    border: 1px solid #d7e0ec;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(15, 61, 110, 0.06);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
  }
  #msg {
    min-height: 20px;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: #475569;
  }
  #msg.ok  { color: #2e7d32; }
  #msg.err { color: #c62828; }
  #msg.win { color: #f57f17; font-size: 16px; }
  #footer {
    display: flex;
    justify-content: center;
    margin-top: 6px;
  }
  #reset {
    padding: 7px 20px;
    font-size: 13px;
    font-weight: 600;
    background: #1976d2;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #reset:hover { background: #0f5cad; }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Найди пару: задача → способ решения</h1>
    <div id="hud">
      <span>Найдено: <b id="found">0</b>/<span id="total">5</span></span>
      <span>Ошибки: <b id="errors">0</b></span>
      <span>Время: <b id="time">0</b> с</span>
    </div>
  </div>

  <div id="board">
    <canvas id="game"></canvas>
  </div>

  <div id="msg">Кликните по карточке слева, затем по подходящей справа</div>

  <div id="footer">
    <button id="reset">Заново</button>
  </div>
</div>

<script>
// ===== Данные =====
const tasks = [
  { id: 't1', text: 'Нужно быстро найти\nинформацию в базе' },
  { id: 't2', text: 'Нужно выстроить\nпоследовательность действий' },
  { id: 't3', text: 'Нужно сравнить\nдва числа' },
  { id: 't4', text: 'Нужно найти\nкратчайший маршрут' },
  { id: 't5', text: 'Нужно упорядочить\nсписок по алфавиту' }
];

const methods = [
  { id: 'm1', text: 'Поиск и сортировка' },
  { id: 'm2', text: 'Алгоритм' },
  { id: 'm3', text: 'Сравнение' },
  { id: 'm4', text: 'Поиск пути' },
  { id: 'm5', text: 'Сортировка' }
];

const correctPairs = {
  t1: 'm1', t2: 'm2', t3: 'm3', t4: 'm4', t5: 'm5'
};

// ===== Элементы =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const board = document.getElementById('board');
const msgEl = document.getElementById('msg');
const foundEl = document.getElementById('found');
const errorsEl = document.getElementById('errors');
const timeEl = document.getElementById('time');
document.getElementById('total').textContent = tasks.length;

// ===== Состояние =====
let W = 800, H = 500;            // виртуальные размеры canvas
let dpr = window.devicePixelRatio || 1;
let leftCards = [], rightCards = [];
let selectedLeft = null;
let matchedLeft = new Set();
let matchedRight = new Set();
let errors = 0;
let startTime = 0, timerId = null;
let wrongFlash = null;
let layout = {};                  // динамический layout

// ===== Утилиты =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== Подгонка размера canvas под контейнер =====
function resizeCanvas() {
  const rect = board.getBoundingClientRect();
  // виртуальный размер = CSS-размер (1:1), с учётом devicePixelRatio для чёткости
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(240, Math.floor(rect.height));
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeLayout();
  draw();
}

// ===== Пересчёт геометрии карточек под текущий размер =====
function computeLayout() {
  const padX = 16;
  const padTop = 26;    // место под заголовки колонок
  const padBottom = 12;
  const gapX = 24;      // зазор между колонками
  const gapY = 10;

  const colW = (W - padX * 2 - gapX) / 2;
  const rows = tasks.length;
  const availH = H - padTop - padBottom;
  const cardH = Math.min(72, Math.floor((availH - gapY * (rows - 1)) / rows));

  layout = {
    padX, padTop, gapY,
    leftX: padX,
    rightX: padX + colW + gapX,
    colW: colW,
    cardH: cardH,
    radius: 10
  };

  leftCards = tasks.map((t, i) => ({
    ...t,
    x: layout.leftX,
    y: layout.padTop + i * (cardH + gapY),
    w: colW,
    h: cardH
  }));

  // правую колонку сохраняем в её текущем порядке
  const order = rightCards.length
    ? rightCards.map(c => c.id)
    : shuffle(methods).map(c => c.id);
  const methodMap = Object.fromEntries(methods.map(m => [m.id, m]));
  rightCards = order.map((id, i) => ({
    ...methodMap[id],
    x: layout.rightX,
    y: layout.padTop + i * (cardH + gapY),
    w: colW,
    h: cardH
  }));
}

// ===== Отрисовка =====
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const lines = [];
  text.split('\n').forEach(part => {
    const words = part.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  });
  return lines;
}

function drawCard(card, opts) {
  const { selected, matched, wrong } = opts;
  const r = layout.radius;

  // фон
  ctx.fillStyle = matched ? '#e6f7ec'
                : wrong   ? '#fdecec'
                : selected? '#e3f0ff'
                : '#ffffff';
  roundRect(card.x, card.y, card.w, card.h, r);
  ctx.fill();

  // рамка
  ctx.lineWidth = 2;
  ctx.strokeStyle = matched ? '#4caf50'
                  : wrong   ? '#e53935'
                  : selected? '#1976d2'
                  : '#cfd9e6';
  roundRect(card.x, card.y, card.w, card.h, r);
  ctx.stroke();

  // текст (масштабируем шрифт от высоты карточки)
  const fs = Math.max(11, Math.min(16, Math.floor(card.h * 0.28)));
  const font = `600 ${fs}px 'Segoe UI', Arial, sans-serif`;
  ctx.fillStyle = matched ? '#1b5e20'
                : wrong   ? '#b71c1c'
                : '#1e293b';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const pad = 12;
  const maxW = card.w - pad * 2 - (matched ? 24 : 0);
  const lines = wrapText(card.text, maxW, font);
  const lineH = fs + 3;
  const totalH = lines.length * lineH;
  let ty = card.y + card.h / 2 - totalH / 2 + lineH / 2;
  for (const line of lines) {
    ctx.fillText(line, card.x + pad, ty);
    ty += lineH;
  }

  // галочка
  if (matched) {
    ctx.fillStyle = '#2e7d32';
    ctx.font = `bold ${Math.floor(fs * 1.4)}px Arial`;
    ctx.textAlign = 'right';
    ctx.fillText('✓', card.x + card.w - 10, card.y + card.h / 2);
  }
}

function drawConnections() {
  for (const left of leftCards) {
    if (!matchedLeft.has(left.id)) continue;
    const right = rightCards.find(r => r.id === correctPairs[left.id]);
    if (!right) continue;

    const x1 = left.x + left.w;
    const y1 = left.y + left.h / 2;
    const x2 = right.x;
    const y2 = right.y + right.h / 2;

    ctx.strokeStyle = '#4caf50';
    ctx.lineWidth = 3;
    ctx.beginPath();
    const cx = (x1 + x2) / 2;
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cx, y1, cx, y2, x2, y2);
    ctx.stroke();

    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  if (!layout.colW) return;

  // фон
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // заголовки колонок
  ctx.fillStyle = '#64748b';
  ctx.font = `bold 12px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText('ЗАДАЧА', layout.leftX, layout.padTop - 10);
  ctx.fillText('СПОСОБ РЕШЕНИЯ', layout.rightX, layout.padTop - 10);

  // соединения (под карточками)
  drawConnections();

  // карточки
  const now = performance.now();
  const wrongActive = wrongFlash && wrongFlash.until > now;

  for (const c of leftCards) {
    drawCard(c, {
      selected: selectedLeft === c.id,
      matched: matchedLeft.has(c.id),
      wrong: wrongActive && wrongFlash.leftId === c.id
    });
  }
  for (const c of rightCards) {
    drawCard(c, {
      selected: false,
      matched: matchedRight.has(c.id),
      wrong: wrongActive && wrongFlash.rightId === c.id
    });
  }

  // победа
  if (matchedLeft.size === tasks.length) {
    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
    ctx.fillRect(0, H / 2 - 40, W, 80);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#f57f17';
    const bigFs = Math.max(20, Math.min(34, Math.floor(W * 0.045)));
    ctx.font = `bold ${bigFs}px 'Segoe UI', Arial, sans-serif`;
    ctx.fillText('🏆 Все пары найдены!', W / 2, H / 2 - 12);

    const t = Math.floor((performance.now() - startTime) / 1000);
    ctx.fillStyle = '#475569';
    ctx.font = `${Math.floor(bigFs * 0.55)}px 'Segoe UI', Arial, sans-serif`;
    ctx.fillText(`Время: ${t} с  •  Ошибок: ${errors}`, W / 2, H / 2 + 20);
  }
}

// ===== Клик =====
function pointInRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

canvas.addEventListener('click', e => {
  if (matchedLeft.size === tasks.length) return;

  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top)  * (H / rect.height);

  // левые
  for (const c of leftCards) {
    if (pointInRect(mx, my, c)) {
      if (matchedLeft.has(c.id)) {
        msgEl.textContent = 'Эта карточка уже соединена';
        msgEl.className = 'err';
        return;
      }
      selectedLeft = c.id;
      msgEl.textContent = 'Теперь выберите способ решения справа';
      msgEl.className = '';
      draw();
      return;
    }
  }

  // правые
  for (const c of rightCards) {
    if (pointInRect(mx, my, c)) {
      if (matchedRight.has(c.id)) {
        msgEl.textContent = 'Этот способ уже использован';
        msgEl.className = 'err';
        return;
      }
      if (!selectedLeft) {
        msgEl.textContent = 'Сначала выберите задачу слева';
        msgEl.className = 'err';
        return;
      }

      const expected = correctPairs[selectedLeft];
      if (expected === c.id) {
        matchedLeft.add(selectedLeft);
        matchedRight.add(c.id);
        foundEl.textContent = matchedLeft.size;

        if (matchedLeft.size === tasks.length) {
          msgEl.textContent = 'Победа! Все пары найдены 🎉';
          msgEl.className = 'win';
          if (timerId) clearInterval(timerId);
        } else {
          msgEl.textContent = 'Верно! ✓';
          msgEl.className = 'ok';
        }
        selectedLeft = null;
      } else {
        errors++;
        errorsEl.textContent = errors;
        wrongFlash = {
          leftId: selectedLeft,
          rightId: c.id,
          until: performance.now() + 700
        };
        msgEl.textContent = 'Неверно! Попробуйте другую пару';
        msgEl.className = 'err';
        selectedLeft = null;
        // перерисовать сразу и снять подсветку через 700 мс
        setTimeout(draw, 700);
      }
      draw();
      return;
    }
  }
});

// ===== Сброс =====
function reset() {
  selectedLeft = null;
  matchedLeft = new Set();
  matchedRight = new Set();
  errors = 0;
  wrongFlash = null;
  msgEl.textContent = 'Кликните по карточке слева, затем по подходящей справа';
  msgEl.className = '';
  errorsEl.textContent = '0';
  foundEl.textContent = '0';

  // новый случайный порядок правой колонки
  rightCards = [];
  computeLayout();

  startTime = performance.now();
  timeEl.textContent = '0';
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    timeEl.textContent = Math.floor((performance.now() - startTime) / 1000);
  }, 300);

  draw();
}

document.getElementById('reset').addEventListener('click', reset);

// ===== Реакция на изменение размера =====
window.addEventListener('resize', resizeCanvas);
if (window.ResizeObserver) {
  new ResizeObserver(resizeCanvas).observe(board);
}

// старт
resizeCanvas();
reset();
</script>
</body>
</html>
