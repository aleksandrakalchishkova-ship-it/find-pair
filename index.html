<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Найди пару: задача → способ решения</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e2a;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    color: #e8f0ff;
  }
  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 12px 14px;
  }
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 8px;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    color: #ffd6f5;
    text-shadow: 0 0 12px rgba(255, 90, 220, 0.6);
    letter-spacing: .3px;
  }
  #hud {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: #b8cbe6;
  }
  #hud b { color: #4fe3ff; text-shadow: 0 0 8px rgba(79, 227, 255, .7); }

  #board {
    position: relative;
    flex: 1;
    border-radius: 12px;
    overflow: hidden;
    background: #0b1030;
    /* фон-картинка с рамкой */
    background-image: url('bg.png');
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-position: center;
    box-shadow: 0 0 24px rgba(255, 90, 220, 0.25);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: pointer;
    /* фон просвечивает сквозь canvas */
    background: transparent;
  }

  /* Оверлей паузы */
  #pauseOverlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 14, 42, 0.75);
    backdrop-filter: blur(2px);
    color: #4fe3ff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(79, 227, 255, 0.9);
    z-index: 5;
  }
  #pauseOverlay.show { display: flex; }

  #msg {
    min-height: 20px;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    color: #b8cbe6;
  }
  #msg.ok  { color: #4fffb0; }
  #msg.err { color: #ff7aa8; }
  #msg.win { color: #ffd84f; font-size: 16px; }

  #footer {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
  }
  button {
    padding: 8px 22px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .4px;
    color: #fff;
    background: rgba(79, 227, 255, 0.12);
    border: 2px solid #4fe3ff;
    border-radius: 8px;
    cursor: pointer;
    transition: all .18s ease;
    text-shadow: 0 0 8px rgba(79, 227, 255, 0.5);
  }
  button:hover:not(:disabled) {
    background: #4fe3ff;
    color: #06101f;
    box-shadow: 0 0 18px rgba(79, 227, 255, 0.8);
    text-shadow: none;
  }
  button:disabled {
    opacity: .35;
    cursor: not-allowed;
    border-color: #6b7a99;
    color: #98a9c7;
    text-shadow: none;
  }
  #btnPause { border-color: #ff8ee0; color: #ffd6f5; }
  #btnPause:hover:not(:disabled) {
    background: #ff8ee0; color: #2b0a24;
    box-shadow: 0 0 18px rgba(255, 142, 224, 0.8);
  }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Найди пару: задача → способ решения</h1>
    <div id="hud">
      <span>Найдено: <b id="found">0</b>/<span id="total">5</span></span>
      <span>Ошибки: <b id="errors">0</b></span>
      <span>Время: <b id="time">0</b> с</span>
    </div>
  </div>

  <div id="board">
    <canvas id="game"></canvas>
    <div id="pauseOverlay">⏸ ПАУЗА</div>
  </div>

  <div id="msg">Нажмите «Старт», чтобы начать игру</div>

  <div id="footer">
    <button id="btnStart">▶ Старт</button>
    <button id="btnPause" disabled>⏸ Пауза</button>
    <button id="reset">⟲ Заново</button>
  </div>
</div>

<script>
// ===== Данные =====
const tasks = [
  { id: 't1', text: 'Нужно быстро найти\nинформацию в базе' },
  { id: 't2', text: 'Нужно выстроить\nпоследовательность действий' },
  { id: 't3', text: 'Нужно сравнить\nдва числа' },
  { id: 't4', text: 'Нужно найти\nкратчайший маршрут' },
  { id: 't5', text: 'Нужно упорядочить\nсписок по алфавиту' }
];

const methods = [
  { id: 'm1', text: 'Поиск и сортировка' },
  { id: 'm2', text: 'Алгоритм' },
  { id: 'm3', text: 'Сравнение' },
  { id: 'm4', text: 'Поиск пути' },
  { id: 'm5', text: 'Сортировка' }
];

const correctPairs = {
  t1: 'm1', t2: 'm2', t3: 'm3', t4: 'm4', t5: 'm5'
};

// ===== Элементы =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const board = document.getElementById('board');
const msgEl = document.getElementById('msg');
const foundEl = document.getElementById('found');
const errorsEl = document.getElementById('errors');
const timeEl = document.getElementById('time');
const pauseOverlay = document.getElementById('pauseOverlay');
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
document.getElementById('total').textContent = tasks.length;

// ===== Состояние =====
let W = 800, H = 500;
let dpr = window.devicePixelRatio || 1;
let leftCards = [], rightCards = [];
let selectedLeft = null;
let matchedLeft = new Set();
let matchedRight = new Set();
let errors = 0;
let layout = {};

// Игровой статус: 'idle' | 'playing' | 'paused' | 'finished'
let gameState = 'idle';
let elapsedBefore = 0;       // накопленное время
let resumeTimestamp = 0;     // момент, когда нажали Старт/Продолжить
let timerId = null;
let wrongFlash = null;

// ===== Утилиты =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ===== Размер canvas =====
function resizeCanvas() {
  const rect = board.getBoundingClientRect();
  W = Math.max(320, Math.floor(rect.width));
  H = Math.max(240, Math.floor(rect.height));
  canvas.width  = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeLayout();
  draw();
}

// ===== Геометрия карточек =====
function computeLayout() {
  const padX = 30;
  const padTop = 40;     // место под заголовки
  const padBottom = 20;
  const gapX = 32;
  const gapY = 10;

  const colW = (W - padX * 2 - gapX) / 2;
  const rows = tasks.length;
  const availH = H - padTop - padBottom;
  const cardH = Math.min(70, Math.floor((availH - gapY * (rows - 1)) / rows));

  layout = { padX, padTop, gapY, leftX: padX, rightX: padX + colW + gapX, colW, cardH, radius: 10 };

  leftCards = tasks.map((t, i) => ({
    ...t,
    x: layout.leftX,
    y: layout.padTop + i * (cardH + gapY),
    w: colW, h: cardH
  }));

  const order = rightCards.length ? rightCards.map(c => c.id)
                                  : shuffle(methods).map(c => c.id);
  const map = Object.fromEntries(methods.map(m => [m.id, m]));
  rightCards = order.map((id, i) => ({
    ...map[id],
    x: layout.rightX,
    y: layout.padTop + i * (cardH + gapY),
    w: colW, h: cardH
  }));
}

// ===== Отрисовка =====
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function wrapText(text, maxWidth, font) {
  ctx.font = font;
  const lines = [];
  text.split('\n').forEach(part => {
    const words = part.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line); line = w;
      } else line = test;
    }
    if (line) lines.push(line);
  });
  return lines;
}

function drawCard(card, opts) {
  const { selected, matched, wrong } = opts;
  const r = layout.radius;

  // Полупрозрачный фон карточки — сквозь него виден твой неоновый фон
  let bg;
  if (matched)       bg = 'rgba(60, 200, 120, 0.18)';
  else if (wrong)    bg = 'rgba(255, 80, 120, 0.20)';
  else if (selected) bg = 'rgba(79, 227, 255, 0.22)';
  else               bg = 'rgba(20, 26, 64, 0.55)';
  ctx.fillStyle = bg;
  roundRect(card.x, card.y, card.w, card.h, r);
  ctx.fill();

  // Рамка со свечением
  ctx.save();
  const borderColor = matched ? '#4fffb0'
                    : wrong   ? '#ff6b8a'
                    : selected? '#4fe3ff'
                    : 'rgba(160, 180, 230, 0.55)';
  ctx.shadowColor = borderColor;
  ctx.shadowBlur = (matched || wrong || selected) ? 14 : 4;
  ctx.lineWidth = 2;
  ctx.strokeStyle = borderColor;
  roundRect(card.x, card.y, card.w, card.h, r);
  ctx.stroke();
  ctx.restore();

  // Текст
  const fs = Math.max(11, Math.min(16, Math.floor(card.h * 0.28)));
  const font = `600 ${fs}px 'Segoe UI', Arial, sans-serif`;
  ctx.fillStyle = matched ? '#c8ffe8'
                : wrong   ? '#ffd0dc'
                : '#eaf3ff';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';

  const pad = 12;
  const maxW = card.w - pad * 2 - (matched ? 24 : 0);
  const lines = wrapText(card.text, maxW, font);
  const lineH = fs + 3;
  const totalH = lines.length * lineH;
  let ty = card.y + card.h / 2 - totalH / 2 + lineH / 2;
  for (const line of lines) {
    ctx.fillText(line, card.x + pad, ty);
    ty += lineH;
  }

  if (matched) {
    ctx.fillStyle = '#4fffb0';
    ctx.font = `bold ${Math.floor(fs * 1.4)}px Arial`;
    ctx.textAlign = 'right';
    ctx.shadowColor = '#4fffb0'; ctx.shadowBlur = 12;
    ctx.fillText('✓', card.x + card.w - 10, card.y + card.h / 2);
    ctx.shadowBlur = 0;
  }
}

function drawConnections() {
  for (const left of leftCards) {
    if (!matchedLeft.has(left.id)) continue;
    const right = rightCards.find(r => r.id === correctPairs[left.id]);
    if (!right) continue;

    const x1 = left.x + left.w, y1 = left.y + left.h / 2;
    const x2 = right.x,        y2 = right.y + right.h / 2;

    ctx.save();
    ctx.strokeStyle = '#4fffb0';
    ctx.shadowColor = '#4fffb0';
    ctx.shadowBlur = 12;
    ctx.lineWidth = 3;
    ctx.beginPath();
    const cx = (x1 + x2) / 2;
    ctx.moveTo(x1, y1);
    ctx.bezierCurveTo(cx, y1, cx, y2, x2, y2);
    ctx.stroke();

    ctx.fillStyle = '#4fffb0';
    ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function draw() {
  if (!layout.colW) return;

  // Прозрачный canvas — фон-картинка просвечивает
  ctx.clearRect(0, 0, W, H);

  // Заголовки колонок
  ctx.fillStyle = 'rgba(200, 220, 255, 0.85)';
  ctx.font = `bold 12px 'Segoe UI', Arial, sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = '#4fe3ff'; ctx.shadowBlur = 8;
  ctx.fillText('ЗАДАЧА', layout.leftX, layout.padTop - 12);
  ctx.fillText('СПОСОБ РЕШЕНИЯ', layout.rightX, layout.padTop - 12);
  ctx.shadowBlur = 0;

  drawConnections();

  const now = performance.now();
  const wrongActive = wrongFlash && wrongFlash.until > now;

  for (const c of leftCards) {
    drawCard(c, {
      selected: selectedLeft === c.id,
      matched: matchedLeft.has(c.id),
      wrong: wrongActive && wrongFlash.leftId === c.id
    });
  }
  for (const c of rightCards) {
    drawCard(c, {
      selected: false,
      matched: matchedRight.has(c.id),
      wrong: wrongActive && wrongFlash.rightId === c.id
    });
  }

  // Победа
  if (gameState === 'finished') {
    ctx.fillStyle = 'rgba(10, 14, 42, 0.75)';
    ctx.fillRect(0, H / 2 - 50, W, 100);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd84f'; ctx.shadowBlur = 22;
    ctx.fillStyle = '#ffd84f';
    const bigFs = Math.max(20, Math.min(36, Math.floor(W * 0.045)));
    ctx.font = `bold ${bigFs}px 'Segoe UI', Arial, sans-serif`;
    ctx.fillText('🏆 Все пары найдены!', W / 2, H / 2 - 14);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#cfe3ff';
    ctx.font = `${Math.floor(bigFs * 0.5)}px 'Segoe UI', Arial, sans-serif`;
    ctx.fillText(`Время: ${Math.round(elapsedBefore / 1000)} с  •  Ошибок: ${errors}`, W / 2, H / 2 + 22);
  }
}

// ===== Таймер =====
function updateTimerDisplay() {
  let t;
  if (gameState === 'playing') {
    t = elapsedBefore + (performance.now() - resumeTimestamp);
  } else {
    t = elapsedBefore;
  }
  timeEl.textContent = Math.floor(t / 1000);
}

function startTimerLoop() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    if (gameState === 'playing') updateTimerDisplay();
  }, 200);
}

// ===== Управление состоянием =====
function startGame() {
  if (gameState === 'playing') return;
  if (gameState === 'finished') reset();

  gameState = 'playing';
  resumeTimestamp = performance.now();
  pauseOverlay.classList.remove('show');
  msgEl.textContent = 'Кликните по карточке слева, затем по подходящей справа';
  msgEl.className = '';
  btnStart.disabled = true;
  btnPause.disabled = false;
  startTimerLoop();
  updateTimerDisplay();
  draw();
}

function pauseGame() {
  if (gameState !== 'playing') return;
  elapsedBefore += performance.now() - resumeTimestamp;
  gameState = 'paused';
  pauseOverlay.classList.add('show');
  msgEl.textContent = '⏸ Пауза';
  msgEl.className = '';
  btnStart.disabled = false;
  btnStart.textContent = '▶ Продолжить';
  btnPause.disabled = true;
  updateTimerDisplay();
}

function resumeGame() {
  if (gameState !== 'paused') return;
  gameState = 'playing';
  resumeTimestamp = performance.now();
  pauseOverlay.classList.remove('show');
  msgEl.textContent = 'Игра продолжается...';
  msgEl.className = '';
  btnStart.disabled = true;
  btnStart.textContent = '▶ Старт';
  btnPause.disabled = false;
  updateTimerDisplay();
}

function reset() {
  selectedLeft = null;
  matchedLeft = new Set();
  matchedRight = new Set();
  errors = 0;
  wrongFlash = null;
  elapsedBefore = 0;
  gameState = 'idle';

  errorsEl.textContent = '0';
  foundEl.textContent = '0';
  timeEl.textContent = '0';

  // новый порядок правой колонки
  rightCards = [];
  computeLayout();

  pauseOverlay.classList.remove('show');
  msgEl.textContent = 'Нажмите «Старт», чтобы начать игру';
  msgEl.className = '';
  btnStart.disabled = false;
  btnStart.textContent = '▶ Старт';
  btnPause.disabled = true;

  draw();
}

// ===== Клик по карточкам =====
function pointInRect(mx, my, r) {
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

canvas.addEventListener('click', e => {
  if (gameState !== 'playing') return;

  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top)  * (H / rect.height);

  // левая колонка
  for (const c of leftCards) {
    if (pointInRect(mx, my, c)) {
      if (matchedLeft.has(c.id)) {
        msgEl.textContent = 'Эта карточка уже соединена';
        msgEl.className = 'err';
        return;
      }
      selectedLeft = c.id;
      msgEl.textContent = 'Теперь выберите способ решения справа';
      msgEl.className = '';
      draw();
      return;
    }
  }

  // правая колонка
  for (const c of rightCards) {
    if (pointInRect(mx, my, c)) {
      if (matchedRight.has(c.id)) {
        msgEl.textContent = 'Этот способ уже использован';
        msgEl.className = 'err';
        return;
      }
      if (!selectedLeft) {
        msgEl.textContent = 'Сначала выберите задачу слева';
        msgEl.className = 'err';
        return;
      }

      const expected = correctPairs[selectedLeft];
      if (expected === c.id) {
        matchedLeft.add(selectedLeft);
        matchedRight.add(c.id);
        foundEl.textContent = matchedLeft.size;

        if (matchedLeft.size === tasks.length) {
          // финиш
          elapsedBefore += performance.now() - resumeTimestamp;
          gameState = 'finished';
          msgEl.textContent = 'Победа! Все пары найдены 🎉';
          msgEl.className = 'win';
          btnStart.disabled = false;
          btnStart.textContent = '▶ Заново';
          btnPause.disabled = true;
          if (timerId) clearInterval(timerId);
          updateTimerDisplay();
        } else {
          msgEl.textContent = 'Верно! ✓';
          msgEl.className = 'ok';
        }
        selectedLeft = null;
      } else {
        errors++;
        errorsEl.textContent = errors;
        wrongFlash = {
          leftId: selectedLeft,
          rightId: c.id,
          until: performance.now() + 700
        };
        msgEl.textContent = 'Неверно! Попробуйте другую пару';
        msgEl.className = 'err';
        selectedLeft = null;
        setTimeout(draw, 700);
      }
      draw();
      return;
    }
  }
});

// ===== Кнопки =====
btnStart.addEventListener('click', () => {
  if (gameState === 'paused') resumeGame();
  else startGame();
});
btnPause.addEventListener('click', pauseGame);
document.getElementById('reset').addEventListener('click', reset);

// ===== Размер =====
window.addEventListener('resize', resizeCanvas);
if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(board);

// ===== Старт =====
resizeCanvas();
reset();
</script>
</body>
</html>
