<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Собери пазл на время</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f1d;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 10px 15px;
            background: radial-gradient(circle at 50% 30%, #14264a 0%, #0a0f1d 80%);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
            width: 100%;
        }

        .header h1 {
            color: #00ffff;
            text-shadow: 0 0 15px #00ffff;
            font-size: 1.4em;
            letter-spacing: 2px;
            margin-bottom: 3px;
        }

        .header p {
            color: #8899bb;
            font-size: 0.8em;
        }

        /* Таймер в правом верхнем углу */
        .timer {
            position: absolute;
            top: 15px;
            right: 20px;
            background: rgba(0, 30, 60, 0.85);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 8px 18px;
            font-size: 1.3em;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            font-family: 'Courier New', monospace;
            z-index: 50;
        }

        .timer.active {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
            border-color: #ffcc00;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        .game-area {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            justify-content: center;
            position: relative;
        }

        /* Лоток */
        .tray {
            width: 380px;
            min-height: 400px;
            background: rgba(0, 30, 60, 0.5);
            border: 2px dashed #00ffff66;
            border-radius: 12px;
            padding: 30px 10px 10px 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 6px;
            position: relative;
            overflow-y: auto;
        }

        .tray-title {
            position: absolute;
            top: 6px;
            left: 12px;
            font-size: 0.7em;
            color: #00ffff99;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Игровое поле */
        .board {
            width: 360px;
            height: 360px;
            background: rgba(0, 30, 60, 0.3);
            border: 2px solid #00ffff;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: repeat(3, 120px);
        }

        .board::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('puzzle.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.1;
            pointer-events: none;
        }

        .cell {
            width: 120px;
            height: 120px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cell[data-filled="true"] {
            border-color: rgba(0, 255, 255, 0.5);
        }

        .piece {
            width: 120px;
            height: 120px;
            background-image: url('puzzle.jpg');
            background-size: 360px 360px;
            background-repeat: no-repeat;
            border-radius: 4px;
            cursor: grab;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
            z-index: 10;
            flex-shrink: 0;
        }

        .piece:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #00ffff;
        }

        .piece.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .piece.placed {
            cursor: default;
            box-shadow: none;
            transform: none;
        }

        .piece.placed:hover {
            transform: none;
        }

        /* Заблокированные кусочки (до старта) */
        .piece.locked {
            cursor: not-allowed;
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .piece.locked:hover {
            transform: none;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        /* Оверлей со стартовой кнопкой */
        .start-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 25, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 200;
            animation: fadeIn 0.4s;
            backdrop-filter: blur(6px);
        }

        .start-overlay.hidden {
            display: none;
        }

        .start-title {
            font-size: 2.2em;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .start-subtitle {
            font-size: 1.1em;
            color: #8899bb;
            margin-bottom: 35px;
            text-align: center;
        }

        .btn-start {
            background: #00ffff;
            color: #0a0f1d;
            border: none;
            padding: 20px 60px;
            font-size: 1.5em;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            animation: pulseBtn 2s infinite;
        }

        .btn-start:hover {
            background: #00ccff;
            transform: scale(1.05);
            box-shadow: 0 0 50px #00ffff;
        }

        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 255, 255, 0.5); }
            50% { box-shadow: 0 0 50px rgba(0, 255, 255, 0.9); }
        }

        /* Победный экран */
        .win-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 10, 25, 0.92);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 300;
            animation: fadeIn 0.6s;
        }

        .win-overlay.show { display: flex; }

        .win-title {
            font-size: 3em;
            color: #ffcc00;
            text-shadow: 0 0 30px #ffcc00;
            margin-bottom: 20px;
            text-align: center;
            animation: pulseWin 1.5s infinite;
        }

        .win-time {
            font-size: 2.5em;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 30px;
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }

        .win-subtitle {
            font-size: 1.3em;
            color: #8899bb;
            margin-bottom: 30px;
        }

        .btn-restart {
            background: #00ffff;
            color: #0a0f1d;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-restart:hover {
            background: #00ccff;
            box-shadow: 0 0 25px #00ffff;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulseWin {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-shuffle {
            background: transparent;
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 8px 20px;
            font-size: 0.9em;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-shuffle:hover {
            background: #ff0055;
            color: #fff;
            box-shadow: 0 0 20px #ff0055;
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <h1>🧩 СОБЕРИ ПАЗЛ НА ВРЕМЯ</h1>
        <p>Нажмите «СТАРТ», затем перетаскивайте кусочки на поле</p>
    </div>

    <div class="timer" id="timer">00:00</div>

    <div class="game-area">
        <div class="tray" id="tray">
            <div class="tray-title">Кусочки</div>
        </div>
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-shuffle" onclick="resetGame()">🔄 Перемешать заново</button>
    </div>
</div>

<!-- Оверлей со стартовой кнопкой -->
<div class="start-overlay" id="startOverlay">
    <div class="start-title">🧩 ГОТОВЫ?</div>
    <div class="start-subtitle">Нажмите «СТАРТ» — и таймер запустится</div>
    <button class="btn-start" onclick="startGame()">▶ СТАРТ</button>
</div>

<!-- Победный экран -->
<div class="win-overlay" id="winOverlay">
    <div class="win-title">🎉 ГОТОВО! 🎉</div>
    <div class="win-time" id="finalTime">00:00</div>
    <div class="win-subtitle">Вы собрали пазл!</div>
    <button class="btn-restart" onclick="resetGame()">Собрать заново</button>
</div>

<script>
    const SIZE = 120;
    const COLS = 3;
    const ROWS = 3;
    const IMAGE_URL = 'puzzle.jpg';

    const tray = document.getElementById('tray');
    const board = document.getElementById('board');
    const cells = board.querySelectorAll('.cell');
    const winOverlay = document.getElementById('winOverlay');
    const startOverlay = document.getElementById('startOverlay');
    const timerEl = document.getElementById('timer');
    const finalTimeEl = document.getElementById('finalTime');

    let draggedPiece = null;
    let gameStarted = false;
    let timerInterval = null;
    let startTime = 0;
    let elapsedSeconds = 0;

    // --- СЕКУНДОМЕР ---
    function startTimer() {
        startTime = Date.now();
        elapsedSeconds = 0;
        timerEl.textContent = '00:00';
        timerEl.classList.add('active');
        timerInterval = setInterval(() => {
            elapsedSeconds = Math.floor((Date.now() - startTime) / 1000);
            timerEl.textContent = formatTime(elapsedSeconds);
        }, 200);
    }

    function stopTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        }
        timerEl.classList.remove('active');
    }

    function resetTimer() {
        stopTimer();
        elapsedSeconds = 0;
        timerEl.textContent = '00:00';
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // --- СТАРТ ИГРЫ ---
    function startGame() {
        startOverlay.classList.add('hidden');
        gameStarted = true;
        // Разблокируем все кусочки
        document.querySelectorAll('.piece').forEach(p => {
            p.classList.remove('locked');
            p.draggable = true;
        });
        startTimer();
    }

    // --- СОЗДАНИЕ КУСОЧКА ---
    function createPiece(index) {
        const piece = document.createElement('div');
        piece.className = 'piece';
        piece.dataset.index = index;
        piece.draggable = false; // изначально заблокирован
        piece.classList.add('locked');

        const row = Math.floor(index / COLS);
        const col = index % COLS;

        piece.style.backgroundImage = `url('${IMAGE_URL}')`;
        piece.style.backgroundSize = `${COLS * SIZE}px ${ROWS * SIZE}px`;
        piece.style.backgroundPosition = `-${col * SIZE}px -${row * SIZE}px`;

        piece.addEventListener('dragstart', (e) => {
            if (!gameStarted) {
                e.preventDefault();
                return;
            }
            draggedPiece = piece;
            piece.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });

        piece.addEventListener('dragend', () => {
            piece.classList.remove('dragging');
            draggedPiece = null;
        });

        piece.addEventListener('touchstart', handleTouchStart, { passive: false });
        piece.addEventListener('touchmove', handleTouchMove, { passive: false });
        piece.addEventListener('touchend', handleTouchEnd, { passive: false });

        return piece;
    }

    // --- ПЕРЕМЕШИВАНИЕ ---
    function shufflePuzzle() {
        tray.innerHTML = '<div class="tray-title">Кусочки</div>';
        cells.forEach(cell => {
            cell.innerHTML = '';
            cell.dataset.filled = 'false';
        });

        const indices = Array.from({ length: 9 }, (_, i) => i);
        for (let i = indices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [indices[i], indices[j]] = [indices[j], indices[i]];
        }

        indices.forEach(idx => {
            const piece = createPiece(idx);
            tray.appendChild(piece);
        });
    }

    // --- СБРОС ИГРЫ ---
    function resetGame() {
        gameStarted = false;
        resetTimer();
        winOverlay.classList.remove('show');
        startOverlay.classList.remove('hidden');
        shufflePuzzle();
    }

    // --- ОБРАБОТЧИКИ ЯЧЕЕК ---
    cells.forEach(cell => {
        cell.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!gameStarted) return;
            if (cell.dataset.filled === 'true') return;
            cell.style.background = 'rgba(0, 255, 255, 0.15)';
        });

        cell.addEventListener('dragleave', () => {
            cell.style.background = '';
        });

        cell.addEventListener('drop', (e) => {
            e.preventDefault();
            cell.style.background = '';
            if (!gameStarted || !draggedPiece) return;

            const pieceIndex = parseInt(draggedPiece.dataset.index);
            const cellIndex = parseInt(cell.dataset.index);

            if (pieceIndex === cellIndex) {
                cell.appendChild(draggedPiece);
                draggedPiece.classList.add('placed');
                draggedPiece.draggable = false;
                cell.dataset.filled = 'true';
                checkWin();
            } else {
                cell.style.background = 'rgba(255, 0, 85, 0.4)';
                setTimeout(() => { cell.style.background = ''; }, 500);
            }
        });
    });

    // --- ПРОВЕРКА ПОБЕДЫ ---
    function checkWin() {
        let filled = 0;
        cells.forEach(cell => {
            if (cell.dataset.filled === 'true') filled++;
        });
        if (filled === 9) {
            stopTimer();
            finalTimeEl.textContent = formatTime(elapsedSeconds);
            setTimeout(() => {
                winOverlay.classList.add('show');
            }, 400);
        }
    }

    // --- СЕНСОРНАЯ ПОДДЕРЖКА ---
    let touchPiece = null;
    let touchOffsetX = 0;
    let touchOffsetY = 0;

    function handleTouchStart(e) {
        const piece = e.currentTarget;
        if (!gameStarted) return;
        if (piece.classList.contains('placed')) return;
        touchPiece = piece;
        const rect = piece.getBoundingClientRect();
        const touch = e.touches[0];
        touchOffsetX = touch.clientX - rect.left;
        touchOffsetY = touch.clientY - rect.top;
        piece.style.position = 'fixed';
        piece.style.zIndex = '999';
        piece.style.pointerEvents = 'none';
        moveAt(touch.clientX, touch.clientY);
    }

    function handleTouchMove(e) {
        if (!touchPiece) return;
        e.preventDefault();
        const touch = e.touches[0];
        moveAt(touch.clientX, touch.clientY);
    }

    function handleTouchEnd(e) {
        if (!touchPiece) return;
        const piece = touchPiece;
        const touch = e.changedTouches[0];

        piece.style.display = 'none';
        const target = document.elementFromPoint(touch.clientX, touch.clientY);
        piece.style.display = '';

        const cell = target ? target.closest('.cell') : null;

        if (cell && cell.dataset.filled !== 'true') {
            const pieceIndex = parseInt(piece.dataset.index);
            const cellIndex = parseInt(cell.dataset.index);

            if (pieceIndex === cellIndex) {
                resetTouchPiece(piece);
                cell.appendChild(piece);
                piece.classList.add('placed');
                cell.dataset.filled = 'true';
                checkWin();
            } else {
                resetTouchPiece(piece);
                tray.appendChild(piece);
                cell.style.background = 'rgba(255, 0, 85, 0.4)';
                setTimeout(() => { cell.style.background = ''; }, 500);
            }
        } else {
            resetTouchPiece(piece);
            tray.appendChild(piece);
        }

        touchPiece = null;
    }

    function moveAt(x, y) {
        touchPiece.style.left = (x - touchOffsetX) + 'px';
        touchPiece.style.top = (y - touchOffsetY) + 'px';
    }

    function resetTouchPiece(piece) {
        piece.style.position = '';
        piece.style.zIndex = '';
        piece.style.left = '';
        piece.style.top = '';
        piece.style.pointerEvents = '';
    }

    // --- ЗАПУСК ---
    window.addEventListener('load', () => {
        shufflePuzzle();
    });
</script>

</body>
</html>
